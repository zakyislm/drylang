name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Build Binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        BIN_NAME="drylang-${{ matrix.goos }}-${{ matrix.goarch }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          BIN_NAME="${BIN_NAME}.exe"
        fi
        go build -o $BIN_NAME .
        
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: drylang-*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
